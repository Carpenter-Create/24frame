<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to 24Frame</title>
  </head>
  <body style="margin:0;padding:0;background:#fafafb">
    <div style="background:#fafafb;margin:0;padding:24px 0">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        width="100%"
        style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #ecedf0"
      >
        <tr>
          <td style="height:4px;background:#1769FF;font-size:0;line-height:0">&nbsp;</td>
        </tr>
        <tr>
          <td style="padding:24px;font-family:Geist,ui-sans-serif,-apple-system,system-ui,sans-serif">
            <p style="margin:0 0 24px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#9aa0a9">
              24Frame
            </p>
            <p style="margin:0 0 12px;font-size:20px;font-weight:600;color:#14171a">Sign in</p>
            <p style="margin:0 0 24px;color:#2b2f36">
              Use this link to sign in. If you didn't request this, you can ignore this message.
            </p>
            <p style="margin:0 0 24px">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:10px 18px;background:#1769FF;color:#ffffff;text-decoration:none;border-radius:999px">Sign in</a>
            </p>
            <p style="margin:0 0 8px;color:#5e646e">Or enter this code:</p>
            <p style="margin:0;font-size:24px;font-weight:600;letter-spacing:2px;color:#14171a">{{ .Token }}</p>
            <p style="margin:32px 0 0;font-size:13px;color:#9aa0a9">24Frame</p>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
