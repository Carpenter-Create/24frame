<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to 24Frame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin:0;padding:0;background:#FAFAFB">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#FAFAFB">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="600"
            style="width:600px;max-width:600px;background:#ffffff;border:1px solid #E6E8EB;border-radius:14px"
          >
            <tr>
              <td style="padding:40px 40px 32px;font-family:Geist,ui-sans-serif,-apple-system,system-ui,sans-serif">
                <img
                  src="https://app.24frame.co/email-logo.png"
                  width="48"
                  height="48"
                  alt="24Frame"
                  style="display:block;border:0;width:48px;height:48px"
                />
                <p style="margin:12px 0 0;font-size:10px;line-height:14px;letter-spacing:0.16em;text-transform:uppercase;color:#9AA0A9">
                  Radically different film distribution.
                </p>
                <div style="margin:24px 0">
                  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse">
                    <tr>
                      <td style="height:1px;background:#E6E8EB;font-size:0;line-height:0">&nbsp;</td>
                    </tr>
                  </table>
                </div>
                <p style="margin:0 0 12px;font-size:23px;line-height:28px;font-weight:600;color:#14171A">Sign in</p>
                <p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#3F4650">
                  Use this link to sign in. If you didn't request this, you can ignore this message.
                </p>
                <p style="margin:0;font-family:Geist,ui-sans-serif,-apple-system,system-ui,sans-serif">
                  <a href="{{ .ConfirmationURL }}" style="color:#1769FF;text-decoration:none">Sign in to 24Frame</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px 40px;font-family:Geist,ui-sans-serif,-apple-system,system-ui,sans-serif">
                <p style="margin:8px 0 20px;font-size:14px">
                  <a href="https://24frame.co" style="color:#1769FF;text-decoration:none">24frame.co</a>
                </p>
                <div style="margin:0 0 20px">
                  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse">
                    <tr>
                      <td style="height:1px;background:#E6E8EB;font-size:0;line-height:0">&nbsp;</td>
                    </tr>
                  </table>
                </div>
                <p style="margin:0 0 4px;font-size:12px;line-height:18px;color:#9AA0A9">
                  © 2026 Global Content Holdings LLC. All rights reserved.
                </p>
                <p style="margin:0 0 12px;font-size:12px;line-height:18px;color:#9AA0A9">
                  3839 McKinney Ave, Suite 155 #2276, Dallas, TX 75204
                </p>
                <p style="margin:0;font-size:12px;line-height:18px">
                  <a href="https://24frame.co/legal" style="color:#9AA0A9;text-decoration:none">Legal</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
